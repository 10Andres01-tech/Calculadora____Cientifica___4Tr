<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/styles.css">

    <title>Calculadora Científica</title>
</head>

<body>

    <center>
        <h1>Calculadora Científica</h1>
    </center>

    <div id="calculadora">

        <div id="operaciones">0</div>

        <ul>

            
            <li class="cientifico">√</li>
            <li class="cientifico">sin</li>
            <li class="cientifico">cos</li>
            <li class="cientifico">^</li>

            
            <li class="numero">7</li>
            <li class="numero">8</li>
            <li class="numero">9</li>
            <li class="simbolo">/</li>

            <li class="numero">4</li>
            <li class="numero">5</li>
            <li class="numero">6</li>
            <li class="simbolo">*</li>

            <li class="numero">1</li>
            <li class="numero">2</li>
            <li class="numero">3</li>
            <li class="simbolo">-</li>

            <li class="decimal">.</li>
            <li class="numero">0</li>
            <li class="igual">=</li>
            <li class="simbolo">+</li>

        </ul>

        <div id="borrar">Borrar</div>

    </div>

    <script src="/js/funcionalidad.js"></script>

</body>

</html>
